name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub Actions page

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "Deployment Bot"
          
          # 1. Clone the specific HF Space (falling back to user's token if secret is not set)
          TOKEN=${HF_TOKEN:-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}
          git clone https://vsk2001:$TOKEN@huggingface.co/spaces/vsk2001/ML_space hf_space
          
          # 2. Clear existing files in Space (to avoid conflicts)
          cd hf_space
          # Be careful not to delete .git
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          
          # 3. Copy contents of ml_service (from parent repo) to Root of Space
          cp -r ../ml_service/* .
          cp ../Dockerfile .
          
          # 4. Push changes
          git add .
          git commit -m "Sync from GitHub" --allow-empty
          git push --force https://vsk2001:$TOKEN@huggingface.co/spaces/vsk2001/ML_space main

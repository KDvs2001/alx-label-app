name: Wake Hugging Face Space

# Custom scheduler to keep Hugging Face Spaces awake.
# Citations/References:
# 1. GitHub Actions Cron Documentation: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule

on:
  schedule:
    # Runs every 12 hours to prevent the space from falling asleep
    - cron: '0 */12 * * *'
  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  wake-space:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space
        run: |
          # Pinging the specific Space URL to reset the inactivity timer
          curl -I "https://vsk2001-ml-space.hf.space"
